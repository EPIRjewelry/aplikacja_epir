name: GMC feed (Shopify → R2)

# 06:00 and 18:00 UTC. Needs existing secret names only:
# SHOPIFY_ADMIN_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

concurrency:
  group: gmc-feed
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: epir-marketing-ingest
    env:
      SHOP: epir-art-silver-jewellery.myshopify.com
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: epir-marketing-ingest/package-lock.json

      - name: Require secrets
        run: |
          if [ -z "${SHOPIFY_ADMIN_TOKEN}" ]; then
            echo "Set GitHub secret SHOPIFY_ADMIN_TOKEN (same name as worker vault)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate CSV (rules only, no LLM)
        run: npm run ingest:csv

      - name: Upload to R2
        run: node scripts/upload-r2.mjs
