type = "web_pixel_extension"
name = "my-web-pixel"
uid = "5dd0f111-62d8-91e2-8f50-8436afb95d0bfe12168a"
runtime_context = "strict"

# Analytics consent is required: Shopify loads this strict app pixel only after
# analytics is allowed, and that is when it exposes clientId (the replacement
# for _shopify_y). Do not set analytics = false — that would run the pixel
# without consent. Marketing and sale-of-data are not required.
[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.accountID]
name = "Account ID"
description = "Account ID"
type = "single_line_text_field"
validations = [
	{ name = "min", value = "1" }
]

[settings.fields.pixelEndpoint]
name = "Pixel Endpoint URL"
description = "Base URL for pixel events (chat worker or analytics). Zmienić przed deployem – np. https://asystent.epirbizuteria.pl"
type = "single_line_text_field"
