# Konfiguracja aplikacji EPIR – jedna aplikacja Shopify łącząca extensions
# client_id: skopiuj z Shopify Partners (App setup → Client credentials)
# application_url: URL workera/backendu (np. chat worker)

name = "epir_ai"
client_id = "80a9878cfb29c901c987bf0046a36238"
application_url = "https://asystent.epirbizuteria.pl"
embedded = true

[build]
automatically_update_urls_on_dev = true
# Jawne ścieżki do extensions – CLI buduje tylko te katalogi
extension_directories = [
  "extensions/asystent-klienta",
  "extensions/my-web-pixel"
]

[webhooks]
api_version = "2026-04"

[access_scopes]
# read_reports: ShopifyQL / shopifyqlQuery (natywna analityka Admin) — wymaga ponownej instalacji aplikacji po zmianie scope.
# read_metaobjects, write_metaobjects: campaign landing ($app:campaign_landing) + shop.metafields.app.campaign_mapping
scopes = "customer_read_customers,customer_read_orders,customer_read_store_credit_accounts,unauthenticated_read_product_listings,read_reports,read_metaobjects,write_metaobjects"

[metaobjects.app.campaign_landing]
name = "Campaign Landing"
display_name_field = "hero_title"
access.storefront = "public_read"

[metaobjects.app.campaign_landing.fields.hero_title]
name = "Hero title"
type = "single_line_text_field"
required = true

[metaobjects.app.campaign_landing.fields.hero_subtitle]
name = "Hero subtitle"
type = "multi_line_text_field"

[metaobjects.app.campaign_landing.fields.product_ids]
name = "Product IDs"
type = "list.single_line_text_field"

[metaobjects.app.campaign_landing.fields.cta_label]
name = "CTA label"
type = "single_line_text_field"

[metaobjects.app.campaign_landing.fields.cta_url]
name = "CTA URL"
type = "single_line_text_field"

[shop.metafields.app.campaign_mapping]
type = "json"
name = "Campaign mapping"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[auth]
redirect_urls = [
  "https://asystent.epirbizuteria.pl/api/auth"
]

# App Proxy – chat worker pod /apps/assistant/*
# Usuń sekcję [app_proxy], jeśli chat worker nie ma być pod /apps/assistant/*
[app_proxy]
url = "https://asystent.epirbizuteria.pl"
subpath = "assistant"
prefix = "apps"
