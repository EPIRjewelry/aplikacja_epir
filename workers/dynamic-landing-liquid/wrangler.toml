name = "epir-dynamic-landing-liquid"
main = "src/index.ts"
compatibility_date = "2025-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Apex DNS: CNAME → this Worker (asystent pattern). Routes not required when Worker is origin.
# Shopify HTML via fetch + cf.resolveOverride(SHOPIFY_ORIGIN_IPV4).

[build]
command = ""

[env.staging]

[env.production]
workers_dev = false

[vars]
SHOPIFY_STOREFRONT_DOMAIN = "epir-art-silver-jewellery.myshopify.com"
SHOPIFY_PUBLIC_DOMAIN = "epirbizuteria.pl"
SHOPIFY_STOREFRONT_API_VERSION = "2024-10"
CAMPAIGN_LANDING_TYPE = "app--280344821761--campaign_landing"
SHOPIFY_ORIGIN_IPV4 = "23.227.38.65"
ADS_LANDING_HOST = "l.epirbizuteria.pl"
# Landings off until operator re-enables (PMax → product URLs). Editorial ready in code.
LANDINGS_ENABLED = "false"
# Ads final URL (when re-enabled): https://l.epirbizuteria.pl/?utm_campaign=forest_premium

# Reuse existing secret name only (no new secret names):
#   npx wrangler secret put SHOPIFY_STOREFRONT_TOKEN --env=""
#   npx wrangler secret put EPIR_OPERATOR_PANEL_SECRET --env=""   # podgląd operatora (ten sam co workers/chat)
#   # lub MARKETING_OPS_PREVIEW_KEY (ten sam co marketing-ingest)
# Value = same Storefront token as workers/chat (online-store fallback).

# Phase A (workers.dev): KV optional — uncomment after `wrangler kv namespace create CAMPAIGN_CACHE`
# [[kv_namespaces]]
# binding = "CAMPAIGN_CACHE"
# id = "REPLACE_AFTER_KV_CREATE"
# preview_id = "REPLACE_AFTER_KV_CREATE"

[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
